<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100d18" />
    <meta name="description" content="Tap Tap Volcano — build crumbling stone lifts and escape the rising magma." />
    <title>Tap Tap Volcano</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100d18; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #boot-cover { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: #fff; background: radial-gradient(ellipse at 52% 72%, #63221c 0%, #251522 38%, #100d18 72%); transition: opacity .3s ease; }
      #boot-cover .boot-mark { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #ffb58a; }
      #boot-cover .boot-title { margin-top: 12px; font-size: clamp(28px, 8vw, 46px); font-weight: 900; letter-spacing: -.06em; }
      #boot-cover .boot-track { width: 116px; height: 3px; margin-top: 24px; border-radius: 99px; overflow: hidden; background: #ffffff22; }
      #boot-cover .boot-track::after { content: ""; display: block; height: 100%; width: 40%; background: #ff764a; border-radius: inherit; animation: boot-slide 1s ease-in-out infinite alternate; }
      @keyframes boot-slide { from { transform: translateX(-10%); } to { transform: translateX(170%); } }
    </style>
  </head>
  <body>
    <div id="boot-cover" aria-live="polite"><div><div class="boot-mark">Crater Escape // 003</div><div class="boot-title">TAP TAP<br />VOLCANO</div><div class="boot-track"></div></div></div>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
